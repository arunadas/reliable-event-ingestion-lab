[project]
name = "reliable-event-ingestion-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.1",
    "psycopg[binary]>=3.3.5",
    "python-ulid>=4.0.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reliable_ingestion"]

[tool.uv]
# Force plain-copy installs instead of the macOS default of clone/CoW.
# This reduces—but does not eliminate—the hidden editable-.pth issue observed
# on this machine. After local source changes, explicitly rebuild the package:
# `uv sync --no-editable --locked
# --reinstall-package reliable-event-ingestion-lab`
# Then run it with:
# `uv run --no-sync python -m reliable_ingestion.producer ...`
# See results/producer_smoke_test.md for the verified evidence.
link-mode = "copy"
