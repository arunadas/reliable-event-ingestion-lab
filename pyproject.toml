[project]
name = "reliable-event-ingestion-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.15.1",
    "psycopg[binary]>=3.3.5",
    "python-ulid>=4.0.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reliable_ingestion"]

[tool.uv]
# Force plain-copy installs instead of the macOS default of clone/CoW.
# In some sandboxed shells the clone path was observed to intermittently
# propagate a hidden (UF_HIDDEN) file flag onto the generated editable-install
# .pth file; CPython's site.py silently skips hidden .pth files, which broke
# `uv run python -m reliable_ingestion.producer ...` outside of pytest.
link-mode = "copy"
